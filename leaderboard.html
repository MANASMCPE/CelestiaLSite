<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Leaderboard | Celestial Syndicate</title>
<meta name="description" content="Top performers across the Celestial network.">
<meta name="theme-color" content="#04050d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>✦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300;500;700&family=Tenor+Sans&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>:root { --veil: radial-gradient(ellipse at 50% 30%, transparent 0 20%, rgba(4,5,13,.5) 60%, rgba(4,5,13,.88) 100%); } main { padding-top: 56px; }</style>
<script>document.documentElement.classList.add("js");try{if(sessionStorage.getItem("cs_boot"))document.documentElement.classList.add("no-boot")}catch(e){}</script>
</head>
<body>
<div class="veil"></div>
<main class="wrap">
  <section style="padding-top:20px">
    <div class="sh rv"><div class="kick">Updated every war cycle</div><h2>Hall of Legends</h2></div>
    <div class="pills" id="pills">
      <button type="button" class="pill on" data-g="all">All Gangs</button>
      <button type="button" class="pill" data-g="celestial">Celestial</button>
      <button type="button" class="pill" data-g="asuka">ASUKA</button>
      <button type="button" class="pill" data-g="zm">ZM</button>
      <button type="button" class="pill" data-g="toman">TOMAN</button>
    </div>
    <div id="board"><div class="msg">Loading rankings...</div></div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="shared.js"></script>
<script src="planets.js"></script>
<script src="scenes.js"></script>
<script>
CS.init({ active: 'leaderboard', boot: { title: 'Leaderboard', art: '<svg viewBox="0 0 140 140" width="140" height="140"><g fill="none" stroke="#7fd6ff" stroke-width="2"><rect x="18" y="70" width="28" height="52"><animate attributeName="height" values="20;52;20" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="102;70;102" dur="1.6s" repeatCount="indefinite"/></rect><rect x="56" y="32" width="28" height="90" stroke="#a468ff"/><rect x="94" y="84" width="28" height="38" stroke="#ff5fa8"/></g></svg>', msgs: [[0, 'Counting points'], [40, 'Sorting legends'], [80, 'Polishing medals']], dur: 1800 } });
CS.scene(CS.scenes.stars);
var ALL = [], filter = 'all', KEYS = ['celestial', 'asuka', 'zm', 'toman'];
CS.load(KEYS).then(function (d) {
  KEYS.forEach(function (k) { (d[k].members || []).forEach(function (m) { ALL.push({ m: m, k: k, gang: d[k].gang }); }); });
  render();
}).catch(function (e) { document.getElementById('board').innerHTML = '<div class="msg err">Could not load rankings: ' + CS.esc(e.message) + '</div>'; });
function render() {
  var list = (filter === 'all' ? ALL.slice() : ALL.filter(function (x) { return x.k === filter; })).sort(function (a, b) { return (b.m.points || 0) - (a.m.points || 0); });
  var el = document.getElementById('board');
  if (!list.length) { el.innerHTML = '<div class="empty"><b>No ranked players yet</b>Add members with points to the gang JSON files and they will appear here.</div>'; return; }
  var lab = ['1st Place', '2nd Place', '3rd Place'];
  var pod = list.slice(0, 3).map(function (x, i) { return '<div class="pod p' + (i + 1) + ' rise" data-tilt><div class="pl">' + (i + 1) + '</div><div class="pg">' + lab[i] + '</div><div class="pn">' + CS.esc(x.m.name) + '</div><div class="pg">' + CS.esc(x.gang) + '</div><div class="pp">' + (x.m.points || 0).toLocaleString() + '</div></div>'; }).join('');
  var rows = list.map(function (x, i) { return '<tr><td class="r">#' + (i + 1) + '</td><td class="nm">' + CS.esc(x.m.name) + '</td><td class="gcol"><span class="gt ' + x.k + '">' + CS.esc(x.gang) + '</span></td><td class="n">' + CS.esc(x.m.kd || '—') + '</td><td class="n">' + (x.m.points || 0).toLocaleString() + '</td></tr>'; }).join('');
  el.innerHTML = '<div class="podium">' + pod + '</div><div class="tbl"><table><thead><tr><th>#</th><th>Player</th><th class="gcol">Gang</th><th class="n">K/D</th><th class="n">Points</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  CS.tilt(el);
}
document.getElementById('pills').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return; filter = b.dataset.g;
  CS.$$('#pills .pill').forEach(function (p) { p.classList.toggle('on', p === b); }); render();
});
</script>
</body>
</html>
