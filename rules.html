<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rules & Ranks | Celestial Syndicate</title>
<meta name="description" content="Gang rules, rank ladder and the alliance charter.">
<meta property="og:title" content="Rules & Ranks | Celestial Syndicate">
<meta property="og:description" content="Gang rules, rank ladder and the alliance charter.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#04050d">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300;500;700&family=Tenor+Sans&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>:root { --veil: radial-gradient(ellipse at 50% 30%, transparent 0 20%, rgba(4,5,13,.5) 60%, rgba(4,5,13,.88) 100%); } main { padding-top: 56px; }</style>
<script>document.documentElement.classList.add("js");try{if(sessionStorage.getItem("cs_boot"))document.documentElement.classList.add("no-boot")}catch(e){}</script>
</head>
<body>
<div class="veil"></div>
<main class="wrap">
  <section style="padding-top:20px">
    <div class="sh rv"><div class="kick">Code of the syndicate</div><h2>Rules &amp; Ranks</h2></div>
    <div class="tabs" id="tabs">
      <button type="button" class="tab on" data-g="celestial">Celestial</button>
      <button type="button" class="tab" data-g="asuka">ASUKA</button>
      <button type="button" class="tab" data-g="zm">ZM</button>
      <button type="button" class="tab" data-g="toman">TOMAN</button>
    </div>
    <div class="rules-grid">
      <div class="panel rv"><h3 id="rt">Rules</h3><div id="rules"></div></div>
      <div style="display:grid;gap:28px">
        <div class="panel rv"><h3>Rank Ladder</h3><div class="ladder" id="ranks"></div></div>
        <div class="panel rv"><h3>Alliance Charter</h3><div id="charter"></div></div>
      </div>
    </div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="shared.js"></script>
<script src="planets.js"></script>
<script src="scenes.js"></script>
<script>
CS.init({ active: 'rules', boot: { title: 'Rules &amp; Ranks', art: '<svg viewBox="0 0 140 140" width="140" height="140"><g fill="none" stroke="#7fd6ff" stroke-width="2"><rect x="32" y="20" width="76" height="100" rx="4"/><path d="M46 46h48M46 66h48M46 86h30" stroke="#a468ff"><animate attributeName="stroke-dasharray" values="0 60;60 0" dur="1.8s" repeatCount="indefinite"/></path></g></svg>', msgs: [[0, 'Opening the codex'], [40, 'Lining up ranks'], [80, 'Sealing the charter']], dur: 1800 } });
CS.scene(CS.scenes.stars);
var S = null, gang = 'celestial', COL = { celestial: '#7fd6ff', asuka: '#ff2b3a', zm: '#ff4fa3', toman: '#f0c05a' };
function rows(a, cls) { return a.map(function (x, i) { return cls === 'r' ? '<div class="rule"><span class="rn">Rule ' + String(i + 1).padStart(2, '0') + '</span><div><strong>' + CS.esc(x.t) + '</strong><span class="d">' + CS.esc(x.d) + '</span></div></div>' : '<div class="rung"><b>' + CS.esc(x.n || x.t) + '</b><small>' + CS.esc(x.d) + '</small></div>'; }).join(''); }
function render() {
  document.documentElement.style.setProperty('--t', COL[gang]);
  document.getElementById('rt').textContent = CS.GANGS[gang].name + ' Rules';
  document.getElementById('rules').innerHTML = rows((S.rules || {})[gang] || [], 'r') || '<div class="msg">Rules jald aa rahe hain.</div>';
  document.getElementById('ranks').innerHTML = rows(S.ranks || []);
  document.getElementById('charter').innerHTML = rows(S.charter || [], 'r');
}
CS.json('site.json').then(function (d) { S = d; render(); }).catch(function (e) { document.getElementById('rules').innerHTML = '<div class="msg err">Could not load: ' + CS.esc(e.message) + '</div>'; });
document.getElementById('tabs').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b || !S) return; gang = b.dataset.g;
  CS.$$('#tabs .tab').forEach(function (p) { p.classList.toggle('on', p === b); }); render();
});
</script>
</body>
</html>
