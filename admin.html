<!DOCTYPE html>
<html lang="en" data-theme="celestial">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Celestial Syndicate</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>⚙</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;position:relative;z-index:2}
.login-card{width:100%;max-width:400px;padding:50px 40px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--border);border-radius:24px;backdrop-filter:blur(20px);text-align:center}
.login-card .lock{font-size:3rem;margin-bottom:22px;filter:drop-shadow(0 0 20px var(--accent))}
.login-card h1{font-family:var(--font-display);font-size:1.4rem;letter-spacing:.06em;color:#fff;margin-bottom:8px}
.login-card p{color:var(--muted);font-size:.9rem;margin-bottom:30px}
.login-card input{width:100%;padding:14px 18px;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:var(--font-body);font-size:1rem;outline:none;margin-bottom:14px;transition:border-color .25s}
.login-card input:focus{border-color:var(--accent)}
.login-card button{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-family:var(--font-body);font-size:.92rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:transform .2s}
.login-card button:hover{transform:translateY(-2px)}
.err{color:#f87171;font-size:.85rem;margin-top:12px;min-height:20px}
#dash{display:none;padding:120px 0 80px;position:relative;z-index:2}
.dash-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px;flex-wrap:wrap;gap:16px}
.dash-header h1{font-family:var(--font-display);font-size:1.5rem;letter-spacing:.06em;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.dash-actions{display:flex;gap:10px;flex-wrap:wrap}
.dash-actions button,.dash-actions a{padding:10px 20px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);font-family:var(--font-body);font-size:.82rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:all .2s}
.dash-actions button:hover,.dash-actions a:hover{background:rgba(167,139,250,.12);border-color:var(--accent)}
.dash-actions .danger:hover{background:rgba(248,113,113,.12);border-color:#f87171;color:#f87171}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:40px}
.stat-box{padding:24px;border-radius:16px;text-align:center;background:rgba(255,255,255,.03);border:1px solid var(--border)}
.stat-box .v{font-family:var(--font-display);font-size:2rem;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat-box .k{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:6px;font-weight:700}
.filters-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.filters-row button{padding:8px 18px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--muted);font-family:var(--font-body);font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:all .2s}
.filters-row button.active{color:#000;background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent}
.app-list{display:grid;gap:14px}
.app-card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:24px;backdrop-filter:blur(10px);transition:border-color .25s}
.app-card:hover{border-color:rgba(167,139,250,.35)}
.app-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.app-name{font-weight:700;font-size:1.1rem;color:#fff}
.app-disc{font-size:.84rem;color:var(--accent-2);font-family:var(--font-display);letter-spacing:.04em;margin-top:4px}
.status-pill{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;padding:6px 14px;border-radius:999px;font-weight:700;white-space:nowrap}
.status-pill.pending{color:#fbbf24;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35)}
.status-pill.accepted{color:#34d399;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.35)}
.status-pill.rejected{color:#f87171;background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.35)}
.app-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:.84rem;color:var(--muted);margin-bottom:14px}
.app-meta b{color:var(--accent);font-weight:600}
.app-reason{font-size:.94rem;color:var(--text);padding:14px 16px;background:rgba(0,0,0,.2);border-left:3px solid var(--accent);border-radius:8px;margin-bottom:16px;white-space:pre-wrap}
.app-actions{display:flex;gap:8px;flex-wrap:wrap}
.app-actions button{padding:8px 18px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);font-family:var(--font-body);font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .2s}
.app-actions .accept:hover{background:rgba(52,211,153,.15);border-color:#34d399;color:#34d399}
.app-actions .reject:hover,.app-actions .del:hover{background:rgba(248,113,113,.15);border-color:#f87171;color:#f87171}
.empty{padding:80px 30px;text-align:center;color:var(--muted);background:rgba(255,255,255,.02);border:1px dashed var(--border);border-radius:16px}
.empty b{color:var(--accent);display:block;margin-bottom:8px;font-size:1.05rem}
.date-tag{font-size:.72rem;color:var(--muted);opacity:.7;font-family:var(--font-display);letter-spacing:.04em}
@media(max-width:640px){#dash{padding:100px 0 60px}.dash-header h1{font-size:1.2rem}}
</style>
</head>
<body>

<div id="login" class="login-wrap">
  <div class="login-card">
    <div class="lock">🔒</div>
    <h1>ADMIN ACCESS</h1>
    <p>Authorized personnel only</p>
    <input type="password" id="pw" placeholder="Enter admin password" autocomplete="off">
    <button onclick="tryLogin()">Unlock</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div id="dash">
  <div class="container">
    <div class="dash-header">
      <h1>✦ ADMIN DASHBOARD</h1>
      <div class="dash-actions">
        <a href="index.html">← Back</a>
        <button onclick="exportJSON()">Export</button>
        <button class="danger" onclick="clearAll()">Clear All</button>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat-box"><div class="v" id="s-total">0</div><div class="k">Total</div></div>
      <div class="stat-box"><div class="v" id="s-pending">0</div><div class="k">Pending</div></div>
      <div class="stat-box"><div class="v" id="s-accepted">0</div><div class="k">Accepted</div></div>
      <div class="stat-box"><div class="v" id="s-rejected">0</div><div class="k">Rejected</div></div>
    </div>
    <div class="filters-row" id="filters">
      <button data-f="all" class="active">All</button>
      <button data-f="pending">Pending</button>
      <button data-f="accepted">Accepted</button>
      <button data-f="rejected">Rejected</button>
    </div>
    <div class="app-list" id="appList"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="shared.js"></script>
<script>
(function(){
  const ctx=Celestial.createScene();
  if(!ctx)return;
  const stars=Celestial.starField(ctx.scene,{count:2500,spread:350,size:.5,colors:[new THREE.Color(0xa78bfa),new THREE.Color(0x22d3ee),new THREE.Color(0xffffff)]});
  Celestial.glowSphere(ctx.scene,'#a78bfa',50,[0,0,-50]);
  ctx.loop((t,m)=>{stars.rotation.y=t*.02;ctx.camera.position.x=m.x*12;ctx.camera.position.y=m.y*8;ctx.camera.lookAt(0,0,-30)});
})();

const KEY='celestial_applications';
const ADMIN_PASSWORD='celestial2024'; // ⚠️ CHANGE THIS!

function tryLogin(){
  const pw=document.getElementById('pw').value;
  if(pw===ADMIN_PASSWORD){sessionStorage.setItem('admin_ok','1');showDash()}
  else{document.getElementById('err').textContent='❌ Wrong password'}
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin()});

function showDash(){document.getElementById('login').style.display='none';document.getElementById('dash').style.display='block';loadApps()}

function loadApps(){
  const list=JSON.parse(localStorage.getItem(KEY)||'[]').sort((a,b)=>new Date(b.date)-new Date(a.date));
  document.getElementById('s-total').textContent=list.length;
  document.getElementById('s-pending').textContent=list.filter(a=>a.status==='pending').length;
  document.getElementById('s-accepted').textContent=list.filter(a=>a.status==='accepted').length;
  document.getElementById('s-rejected').textContent=list.filter(a=>a.status==='rejected').length;
  renderList(list);
}

let currentFilter='all';
function renderList(list){
  const wrap=document.getElementById('appList');
  const filtered=currentFilter==='all'?list:list.filter(a=>a.status===currentFilter);
  if(!filtered.length){wrap.innerHTML=`<div class="empty"><b>No applications.</b>${currentFilter==='all'?'Once users apply, they appear here.':'Try a different filter.'}</div>`;return}
  wrap.innerHTML=filtered.map(a=>`<div class="app-card"><div class="app-head"><div><div class="app-name">${Celestial.escapeHtml(a.ign)}</div><div class="app-disc">${Celestial.escapeHtml(a.discord)}</div></div><span class="status-pill ${a.status}">${a.status}</span></div><div class="app-meta"><span>Gang: <b>${Celestial.escapeHtml(a.gang)}</b></span><span>Rank: <b>${Celestial.escapeHtml(a.rank)}</b></span><span>Exp: <b>${Celestial.escapeHtml(a.experience)}</b></span><span class="date-tag">${new Date(a.date).toLocaleString()}</span></div><div class="app-reason">${Celestial.escapeHtml(a.reason)}</div><div class="app-actions"><button class="accept" onclick="setStatus('${a.id}','accepted')">✓ Accept</button><button class="reject" onclick="setStatus('${a.id}','rejected')">✗ Reject</button><button class="del" onclick="delApp('${a.id}')">🗑 Delete</button></div></div>`).join('');
}

function setStatus(id,status){const list=JSON.parse(localStorage.getItem(KEY)||'[]');const a=list.find(x=>x.id===id);if(a){a.status=status;localStorage.setItem(KEY,JSON.stringify(list))}loadApps()}
function delApp(id){if(!confirm('Delete?'))return;let list=JSON.parse(localStorage.getItem(KEY)||'[]').filter(x=>x.id!==id);localStorage.setItem(KEY,JSON.stringify(list));loadApps()}
function clearAll(){if(!confirm('Delete ALL applications?'))return;localStorage.removeItem(KEY);loadApps()}
function exportJSON(){const list=JSON.parse(localStorage.getItem(KEY)||'[]');const blob=new Blob([JSON.stringify(list,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='applications_'+new Date().toISOString().slice(0,10)+'.json';a.click()}

document.getElementById('filters').addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;document.querySelectorAll('#filters button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentFilter=btn.dataset.f;loadApps()});

if(sessionStorage.getItem('admin_ok')==='1')showDash();
</script>
</body>
</html>
